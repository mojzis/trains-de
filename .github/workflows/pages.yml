name: Pages

# Rebuilds the site from fresh feeds and publishes it to GitHub Pages.
# gtfs.de covers only ~30 days ahead, so a weekly rebuild keeps the dates live.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen

      - name: Fetch feeds
        run: uv run railcorridor fetch -f de_fv -f de_rv -f cz_czptt
      - name: Build DuckDB
        run: uv run railcorridor build-db -f de_fv -f de_rv -f cz_czptt

      - name: Query next Monday and Tuesday
        run: |
          mon=$(date -u -d "next monday" +%F)
          tue=$(date -u -d "$mon + 1 day" +%F)
          for d in "$mon" "$tue"; do
            uv run railcorridor query --from "Praha hl.n." --to "Lüneburg" \
              --date "$d" --depart-window 04:00-11:00 --both-directions
          done

      - name: Render site
        run: |
          uv run railcorridor site
          mkdir -p _site
          for d in out/*/; do
            p=$(basename "$d")
            mkdir -p "_site/$p"
            cp "$d/index.html" "_site/$p/"
          done
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Rail corridor explorer</title>
          <meta http-equiv="refresh" content="0; url=praha-luneburg/">
          <a href="praha-luneburg/">Praha ⇄ Lüneburg</a>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
